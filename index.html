<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SnapShrink</title>
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111418;--card:#1c2127;--line:#2c333b;--fg:#eef1f4;--dim:#98a2ad;--acc:#3b9eff;--ok:#4cc38a;--bad:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--line:#dfe3e8;--fg:#14181d;--dim:#5d6873;--acc:#0b6bcb;--ok:#18794e;--bad:#c62828}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.lbl{font-size:13px;color:var(--dim);margin-bottom:6px}
.chips{display:flex;gap:8px}
.chips button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main{flex:1;overflow-y:auto;padding:4px 16px 12px}
.empty{color:var(--dim);text-align:center;margin-top:18vh;padding:0 20px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.item img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:var(--line);flex:none}
.info{flex:1;min-width:0}
.sz{font-weight:600}
.sz b{color:var(--ok)}
.sz.over b{color:var(--bad)}
.meta{font-size:13px;color:var(--dim);margin-top:2px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button,.bar button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:14px}
.acts button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line)}
footer label{display:flex;align-items:center;justify-content:center;border-radius:14px;font-weight:600;height:60px;cursor:pointer;user-select:none}
#shoot{flex:2;background:var(--acc);color:#fff;font-size:18px}
#pick{flex:1;background:var(--card);border:1px solid var(--line)}
footer input{display:none}
.busy{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="lbl">Maximum file size</div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="bar" id="bar" hidden>
    <button id="clear">Clear</button>
    <button id="shareAll">Share all</button>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty">Take a photo and it is shrunk to a small JPEG, ready to upload.</div>
</main>
<footer id="foot">
  <label id="pick">Gallery<input id="fPick" type="file" accept="image/*" multiple></label>
  <label id="shoot">Take photo<input id="fCam" type="file" accept="image/*" capture="environment"></label>
</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const SIZES = [[300, '300 KB'], [500, '500 KB'], [1000, '1 MB'], [2000, '2 MB']];
const MAX_EDGE = 4096;   // never output larger than this on the long side
const MIN_EDGE = 1024;   // never shrink below this; drop quality instead
const Q_FLOOR = 0.74;    // below this JPEG artefacts start to eat fine detail
const Q_TOP = 0.90;

let maxKB = 500;
try { maxKB = +localStorage.getItem('maxKB') || 500; } catch (e) {}
const results = [];

/* ---------- size chips ---------- */
function drawChips() {
  $('chips').innerHTML = '';
  for (const [kb, text] of SIZES) {
    const b = document.createElement('button');
    b.textContent = text;
    if (kb === maxKB) b.className = 'on';
    b.onclick = () => {
      maxKB = kb;
      try { localStorage.setItem('maxKB', kb); } catch (e) {}
      drawChips();
    };
    $('chips').appendChild(b);
  }
}

/* ---------- compression ---------- */
async function decode(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  try { return await createImageBitmap(file); } catch (e) {}
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}

function canvasOf(src, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { alpha: false });
  x.fillStyle = '#fff';
  x.fillRect(0, 0, w, h);
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, w, h);
  return c;
}

// Halve repeatedly before the final resize: much sharper than one big jump.
function render(src, sw, sh, w, h) {
  let cur = src, cw = sw, ch = sh;
  while (cw / 2 >= w && ch / 2 >= h && cw > 2 && ch > 2) {
    const n = canvasOf(cur, Math.round(cw / 2), Math.round(ch / 2));
    if (cur !== src) cur.width = 0;
    cur = n; cw = n.width; ch = n.height;
  }
  if (cur !== src && cw === w && ch === h) return cur;
  const out = canvasOf(cur, w, h);
  if (cur !== src) cur.width = 0;
  return out;
}

const enc = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));

// Highest quality in [lo, hi] that fits. `fit` is a blob known to fit at lo (or null).
async function bestQuality(c, lo, hi, fit, maxBytes, steps) {
  for (let i = 0; i < steps; i++) {
    const mid = (lo + hi) / 2;
    const b = await enc(c, mid);
    if (b.size <= maxBytes) { fit = b; lo = mid; } else hi = mid;
  }
  return fit;
}

async function compress(file, maxBytes) {
  const src = await decode(file);
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const long = Math.max(sw, sh);
  const minScale = Math.min(1, MIN_EDGE / long);
  const cap = Math.min(1, MAX_EDGE / long);
  // Start near the size a typical photo needs for this byte budget (~0.8 bit per pixel),
  // so most photos are done in one pass instead of encoding the full-size image first.
  let scale = Math.max(minScale, Math.min(cap, Math.sqrt(maxBytes * 10 / (sw * sh))));
  let grew = false, out = null;

  for (let pass = 0; pass < 8 && !out; pass++) {
    const w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
    const c = render(src, sw, sh, w, h);
    const base = await enc(c, Q_FLOOR);
    if (base.size <= maxBytes) {
      const top = await enc(c, Q_TOP);
      if (top.size > maxBytes) {
        out = { blob: await bestQuality(c, Q_FLOOR, Q_TOP, base, maxBytes, 3), w, h };
      } else if (!grew && scale < cap && top.size < maxBytes * 0.7) {
        // Lots of budget left: spend it on more pixels (once).
        grew = true;
        scale = Math.min(cap, scale * Math.sqrt(maxBytes / top.size) * 0.92);
      } else {
        out = { blob: top, w, h };
      }
    } else if (scale <= minScale) {
      // Already at the smallest size we allow: trade quality for bytes.
      const low = await enc(c, 0.3);
      out = low.size <= maxBytes
        ? { blob: await bestQuality(c, 0.3, Q_FLOOR, low, maxBytes, 4), w, h }
        : { blob: low, w, h, over: true };
    } else {
      // JPEG size tracks pixel count, so jump straight to the scale that should fit.
      scale = Math.max(minScale, scale * Math.min(0.9, Math.sqrt(maxBytes / base.size) * 0.97));
    }
    c.width = 0;
  }
  if (src.close) src.close();

  // If re-encoding did not help and the original is already acceptable, keep it.
  if (/^image\/(jpeg|png)$/.test(file.type) && file.size <= maxBytes && file.size <= out.blob.size) {
    return { blob: file, w: sw, h: sh, name: file.name, kept: true };
  }
  return out;
}

/* ---------- UI ---------- */
const fmt = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const pad = n => String(n).padStart(2, '0');
let seq = 0;
function stamp() {
  const d = new Date();
  return 'IMG_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
    pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '_' + (++seq) + '.jpg';
}

function save(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

async function share(files) {
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) { /* cancelled */ }
  } else files.forEach(save);
}

function addItem(r, original) {
  const file = new File([r.blob], r.name || stamp(), { type: r.blob.type || 'image/jpeg' });
  const url = URL.createObjectURL(file);
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML =
    '<a target="_blank"><img alt=""></a><div class="info">' +
    '<div class="sz"></div><div class="meta"></div>' +
    '<div class="acts"><button class="p">Share</button><button>Save</button></div></div>';
  el.querySelector('a').href = url;
  el.querySelector('img').src = url;
  const sz = el.querySelector('.sz');
  sz.innerHTML = fmt(original) + ' → <b>' + fmt(file.size) + '</b>';
  if (r.over) sz.classList.add('over');
  el.querySelector('.meta').textContent = r.w + ' × ' + r.h +
    (r.over ? ' · could not reach the limit' : r.kept ? ' · already small, kept as is' : '');
  const [bShare, bSave] = el.querySelectorAll('.acts button');
  bShare.onclick = () => share([file]);
  bSave.onclick = () => save(file);
  $('list').prepend(el);
  results.push({ file, url });
  refresh();
}

function refresh() {
  $('empty').hidden = results.length > 0;
  $('bar').hidden = results.length === 0;
  $('shareAll').hidden = results.length < 2;
}

async function handle(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  $('foot').classList.add('busy');
  const label = $('shoot').firstChild;
  for (let i = 0; i < files.length; i++) {
    label.textContent = files.length > 1 ? 'Shrinking ' + (i + 1) + '/' + files.length + '…' : 'Shrinking…';
    try {
      addItem(await compress(files[i], maxKB * 1000), files[i].size);
    } catch (e) {
      alert('Could not read ' + (files[i].name || 'that picture') + '.');
    }
  }
  label.textContent = 'Take photo';
  $('foot').classList.remove('busy');
}

$('fCam').onchange = e => handle(e.target);
$('fPick').onchange = e => handle(e.target);
$('shareAll').onclick = () => share(results.map(r => r.file));
$('clear').onclick = () => {
  results.forEach(r => URL.revokeObjectURL(r.url));
  results.length = 0;
  $('list').innerHTML = '';
  refresh();
};

drawChips();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
